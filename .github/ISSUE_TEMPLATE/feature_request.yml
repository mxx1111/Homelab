name: Feature request / 功能建议
description: 建议一个新功能或改进 / Suggest an idea
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        这个项目的取向是「少而准」：每加一张卡片都要能回答「它帮我在什么时候
        做什么决定」。所以请先说问题，再说方案。
        This project aims for "few but sharp" — describe the problem first.
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题 / What problem are you solving
      description: 不要只描述想要的功能形态，说清楚实际遇到的困难
    validations: {required: true}
  - type: textarea
    id: solution
    attributes:
      label: 你设想的方案 / Your proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: 现在你是怎么绕过的 / How do you work around it today
